[build-system]
requires = ["setuptools>=64", "wheel", "cmake>=3.25.2", "nvidia-dali-cuda130==2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cassandra-dali-plugin"
version = "1.3.0a0"
description = "Cassandra data loader for ML pipelines"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Francesco Versaci", email = "francesco.versaci@gmail.com" },
    { name = "Giovanni Busonera", email = "giovanni.busonera@crs4.it" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "boto3>=1.42.77",
    "cassandra-driver>=3.29.3",
    "clize>=5.0.2",
    "ipython>=9.10.1",
    "nvidia-dali-cuda130==2.0",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "tqdm>=4.67.3",
    # "lightning>=2.6.1",
    # "torch>=2.11.0",
    # "torchvision>=0.26.0",
]

[tool.uv.extra-build-dependencies]
cassandra-dali-plugin = ["nvidia-dali-cuda130==2.0"]

[project.urls]
Homepage = "https://github.com/crs4/cassandra-dali-plugin"
Repository = "https://github.com/crs4/cassandra-dali-plugin"

[tool.setuptools]
packages = ["crs4.cassandra_utils"]
