[build-system]
requires = ["setuptools>=64", "wheel", "cmake>=3.25.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cassandra-dali-plugin"
version = "1.3.0"
description = "Cassandra data loader for ML pipelines"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Francesco Versaci", email = "francesco.versaci@gmail.com" },
    { name = "Giovanni Busonera", email = "giovanni.busonera@crs4.it" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "cassandra-driver",
    "pandas",
    "tqdm",
]

[tool.uv.extra-build-dependencies]
cassandra-dali-plugin = ["nvidia-dali-cuda130==1.53"]

[project.urls]
Homepage = "https://github.com/crs4/cassandra-dali-plugin"
Repository = "https://github.com/crs4/cassandra-dali-plugin"

[tool.setuptools]
packages = ["crs4.cassandra_utils"]
